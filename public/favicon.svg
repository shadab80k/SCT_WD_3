<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- Grid -->
  <line x1="33" y1="20" x2="33" y2="80" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="67" y1="20" x2="67" y2="80" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="20" y1="33" x2="80" y2="33" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="20" y1="67" x2="80" y2="67" stroke="white" stroke-width="2" opacity="0.4"/>
  
  <!-- X in top-left -->
  <line x1="23" y1="23" x2="30" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="23" x2="23" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- O in center -->
  <circle cx="50" cy="50" r="8" stroke="white" stroke-width="3" fill="none"/>
  
  <!-- X in bottom-right -->
  <line x1="70" y1="70" x2="77" y2="77" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="77" y1="70" x2="70" y2="77" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
